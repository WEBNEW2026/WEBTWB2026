##############################################################
# NGINX CONFIG - Taman Wisata Bougenville
# File ini untuk di-copy ke:
# /etc/nginx/sites-available/tamanwisatabougenville.com
# Lalu: sudo ln -s /etc/nginx/sites-available/tamanwisatabougenville.com /etc/nginx/sites-enabled/
# Lalu: sudo nginx -t && sudo systemctl reload nginx
##############################################################

server {
    listen 80;
    listen [::]:80;
    server_name tamanwisatabougenville.com www.tamanwisatabougenville.com;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tamanwisatabougenville.com www.tamanwisatabougenville.com;

    # SSL Certificate (Let's Encrypt / Certbot)
    ssl_certificate     /etc/letsencrypt/live/tamanwisatabougenville.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tamanwisatabougenville.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Root directory — sesuaikan dengan path dist/ setelah build
    root /var/www/tamanwisatabougenville/dist;
    index index.html;

    # ============================================================
    # SECURITY HEADERS
    # ============================================================
    add_header X-Content-Type-Options      "nosniff"                            always;
    add_header X-Frame-Options             "SAMEORIGIN"                         always;
    add_header X-XSS-Protection            "1; mode=block"                      always;
    add_header Referrer-Policy             "strict-origin-when-cross-origin"    always;
    add_header Permissions-Policy          "camera=(), microphone=(), geolocation=()" always;

    # Content Security Policy — mengizinkan Google Tag Manager, GA4, Meta Pixel, Clarity, dll.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com https://www.googleadservices.com https://googleads.g.doubleclick.net https://googleleads.g.doubleclick.net https://td.doubleclick.net https://pagead2.googlesyndication.com https://connect.facebook.net https://analytics.tiktok.com https://js-agent.newrelic.com https://claritycdn.microsoft.com https://www.clarity.ms https://aistudiocdn.com https://static.hotjar.com https://script.hotjar.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://region1.google-analytics.com https://www.googletagmanager.com https://www.googleadservices.com https://googleads.g.doubleclick.net https://googleleads.g.doubleclick.net https://stats.g.doubleclick.net https://td.doubleclick.net https://pagead2.googlesyndication.com https://www.google.com https://api.frankfurter.app https://analytics.tiktok.com https://www.clarity.ms https://e.clarity.ms https://connect.facebook.net https://js-agent.newrelic.com https://bam.nr-data.net; frame-src 'self' https://www.googletagmanager.com https://td.doubleclick.net https://googleads.g.doubleclick.net https://googleleads.g.doubleclick.net https://www.google.com; base-uri 'self'; form-action 'self' https://wa.me;" always;

    # ============================================================
    # REACT SPA ROUTING - Semua path diarahkan ke index.html
    # ============================================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ============================================================
    # STATIC ASSETS - Cache panjang karena pakai content hash
    # ============================================================
    location ~* /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(js|css|woff2|woff|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Sitemap, robots.txt, manifest — cache lebih pendek
    location ~* \.(xml|txt|json|webmanifest)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # ============================================================
    # GZIP COMPRESSION
    # ============================================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ============================================================
    # ERROR PAGES
    # ============================================================
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;
}
